<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfume Website - Contact Us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-spray-can-sparkles"></i> Perfume Website</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <div class="contact-wrap">

    <div class="contact-info">
      <h2>Get In Touch</h2>
      <div class="divider" style="margin-left: 0;"></div>
      <p><i class="fa-solid fa-location-dot"></i> 12 Market Road, Ajmer, Rajasthan</p>
      <p><i class="fa-solid fa-phone"></i> +91 98765 43210</p>
      <p><i class="fa-solid fa-envelope"></i> hello@aromaluxe.com</p>
      <p><i class="fa-solid fa-clock"></i> Mon - Sat: 10 AM to 8 PM</p>
    </div>

    <div class="contact-form">
      <h2>Send a Message</h2>
      <div class="divider" style="margin-left: 0;"></div>
      <form>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea rows="5" placeholder="Your Message"></textarea>
        <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send</button>
      </form>
    </div>

    <section class="contact-map">
      <h2>Find Our Shop</h2>
      <div class="divider" style="margin-left: 0;"></div>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3571.9461101728425!2d74.63249187487932!3d26.457465979507315!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x396be71c1259038d%3A0x387b34445ffb8a32!2sMadar%20Gate%2C%20Purani%20Mandi%20Rd%2C%20Diggi%20Bazaar%2C%20Ajmer%2C%20Rajasthan%20305001!5e0!3m2!1sen!2sin!4v1792655671816!5m2!1sen!2sin"
        title="Map showing Madar Gate, Ajmer"
        allowfullscreen
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </section>

  </div>

  <footer>
    <p>&copy; 2026 Perfume Website. All rights reserved.</p>
    <p>
      <i class="fa-brands fa-instagram"></i>
      <i class="fa-brands fa-facebook"></i>
      <i class="fa-brands fa-twitter"></i>
    </p>
  </footer>

</body>
</html>
